services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oda
      POSTGRES_PASSWORD: oda
      POSTGRES_DB: oda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oda -d oda"]
      interval: 5s
      timeout: 5s
      retries: 5

# Backend and frontend services are added in step 58.
volumes:
  pgdata:
